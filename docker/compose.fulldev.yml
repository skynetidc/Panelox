services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: panelox
      POSTGRES_USER: panelox
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panelox"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      PANELOX_PORT: "8080"
      PANELOX_DATABASE_URL: "postgres://panelox:devpassword@postgres:5432/panelox?sslmode=disable"
      PANELOX_JWT_SECRET: "dev-jwt-secret-change-in-production-minimum-64-characters-long!!"
      PANELOX_CORS_ORIGINS: "http://localhost:5173,http://localhost:8080"
      PANELOX_LOG_LEVEL: "debug"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - www:/www
      - backups:/opt/panelox/backups
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  # Seed data on first run
  seed:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      PANELOX_DATABASE_URL: "postgres://panelox:devpassword@postgres:5432/panelox?sslmode=disable"
      PANELOX_JWT_SECRET: "dev-jwt-secret-change-in-production-minimum-64-characters-long!!"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 3
        echo "Running seed..."
        panelox -migrate
        echo "Seed complete."
    restart: "no"

volumes:
  pgdata:
  www:
  backups:
