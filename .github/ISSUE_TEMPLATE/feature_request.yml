name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Panelox? We'd love to hear it!

  - type: dropdown
    id: module
    attributes:
      label: Related Module
      options:
        - Dashboard
        - Websites
        - SSL/TLS
        - DNS
        - Mail
        - Databases
        - Firewall
        - File Manager
        - Terminal
        - Docker/Containers
        - App Store
        - Cron Jobs
        - Backups
        - Monitoring
        - Analytics
        - Git Deploy
        - Security
        - Settings
        - Users / RBAC
        - Nodes (Multi-server)
        - API / Webhooks
        - New Module
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What feature would you like to see?
      placeholder: "It would be great if Panelox could..."
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use Case
      description: Why do you need this? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any workarounds or alternatives?
    validations:
      required: false
